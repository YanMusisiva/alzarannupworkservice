services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alzar
      POSTGRES_USER: alzar
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - alzar_postgres:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
volumes:
  alzar_postgres:
